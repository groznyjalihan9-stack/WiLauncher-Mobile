name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "catalog/**"
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ["arm64", "x86_64"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Without the WiLauncher signing key the build is signed with the Android debug key.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :FCL:assembleRelease -Darch=${{ matrix.arch }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wilauncher-${{ matrix.arch }}
          path: FCL/build/outputs/apk/release/*.apk
          retention-days: 7
